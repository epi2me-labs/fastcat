include:
    - project: "epi2melabs/ci-templates"
      file:
          - "push-github.yaml"
          - "push-conda.yaml"
          - "snippets.yaml"
          - ".eks-tags.yaml"

image: ${UBUNTUIMAGE}:22.04

default:
  tags: !reference [.eks-small-standard-tags, tags]

.parallel-makeflags: &parallel-makeflags 'export MAKEFLAGS="-j$(nproc) --output-sync=target --no-print-directory"'

variables:
    GIT_SUBMODULE_STRATEGY: recursive
    IMAGE_CLANG: ${UBUNTUIMAGE}:26.04


.prep-image: &prep-image |
    DEBIAN_FRONTEND=noninteractive
    apt update -qq
    apt install -y --no-install-recommends gcc autoconf automake valgrind make curl wget zlib1g-dev libbz2-dev libreadline-dev libssl-dev libffi-dev liblzma-dev libcurl4-gnutls-dev cmake python3 python3-venv clang-format clang-tidy clang-tools

stages:
    - preflight
    - test
    - prerelease
    - release


check-changelog:
    stage: preflight
    image: ${WHALEFISH}/${CWG_GLEEOK_IMAGE}
    script:
        - !reference [.install, gleeok]
        - gleeok changelog validate CHANGELOG.md

check-summary-json-schema:
    stage: test
    before_script:
        - *prep-image
    script:
        - make summary_json_schema_check
        - make summary_json_docs_check

check-report-template:
    stage: test
    before_script:
        - *prep-image
    script:
        - make report_template_check

.fastcat-test-base:
    stage: test
    before_script:
        - *prep-image
    script:
        - ./build/fastcat fastq --help
        - ./build/fastcat bam --help
        - ./build/fastcat index --help

build_and_test:
    extends: .fastcat-test-base
    tags: !reference [.eks-large-standard-tags, tags]
    script:
        - *parallel-makeflags
        - make
        - !reference [.fastcat-test-base, script]
        - BUILD_MODE=valgrind REPORT_DEMO_N=100 make test

report_demo:
    extends: .fastcat-test-base
    script:
        - make
        - REPORT_DEMO_N=100000 REPORT_DEMO_DURATION_S=172800 make demo
        - rm -f test/tmp/report_html/reads.*fastq* test/tmp/report_html/aligned_reads.sam
        - mv test/tmp/report_html/ demo
    artifacts:
      when: always
      paths:
        - demo/

report_browser_smoke:
    stage: test
    image: mcr.microsoft.com/playwright/python:v1.52.0-noble
    needs:
        - job: report_demo
          artifacts: true
    script:
        - export CHROME_BIN="$(find /ms-playwright -type f -name chrome -print -quit)"
        - test -n "$CHROME_BIN"
        - python3 tools/dev-tools check_report_browser --browser "$CHROME_BIN" demo/fastcat_out/fastcat_report.html
        - python3 tools/dev-tools check_report_browser --browser "$CHROME_BIN" demo/aligned_out/fastcat_report.html

pages:
    stage: release
    needs:
        - job: report_demo
          artifacts: true
    script:
        - rm -rf public
        - mkdir -p public
        - cp -a demo/aligned_out/fastcat_report.html public/index.html
    artifacts:
        paths:
            - public
    rules:
        - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

clang_format_check:
    image: ${IMAGE_CLANG}
    stage: test
    before_script:
        - *prep-image
    script:
        - make clang_format_check

clang_tidy:
    image: ${IMAGE_CLANG}
    stage: test
    before_script:
        - *prep-image
    script:
        - BUILD_MODE=debug make clang_tidy

scan_build:
    image: ${IMAGE_CLANG}
    stage: test
    tags: !reference [.eks-large-standard-tags, tags]
    before_script:
        - *prep-image
    script:
        - *parallel-makeflags
        - BUILD_MODE=debug make scan_build
    artifacts:
        when: always
        expire_in: 7 days
        paths:
            - scan-build-results/

sanitize:
    extends: .fastcat-test-base
    tags: !reference [.eks-large-standard-tags, tags]
    script:
        - *parallel-makeflags
        - BUILD_MODE=sanitize make
        - !reference [.fastcat-test-base, script]
        - BUILD_MODE=sanitize make test

deploy-checks:
    stage: prerelease
    script:
        - !reference [.check, argp-c-version]
        - !reference [.check, changelog]
        - export LICENSE_FILE="BSD-4-CLAUSE"
        - !reference [.check, license]
    rules:
        - if: '$CI_COMMIT_TAG =~ /^v[[:digit:]]+\.[[:digit:]]+\.[[:digit:]]+$/'


.before-script: &before-script |
    export CONDA_PKG=${CI_PROJECT_NAME}
    export CONDA_PKG_VERSION=${CI_COMMIT_TAG/v/}
    cd conda

conda:
    extends: .deploy-conda
    before_script:
        - *prep-image
        - *before-script

conda-arm:
    extends: .deploy-conda-linux-arm
    before_script:
        - *prep-image
        - *before-script

conda-mac-arm:
    extends: .deploy-conda-mac-arm
    before_script:
        - *before-script

test-conda-arm:
    stage: test
    extends: .deploy-conda-linux-arm
    variables:
        UPLOAD: "no"
    before_script:
        - *prep-image
        - *before-script
    rules:
    - if: $CI_COMMIT_BRANCH != null

test-conda-mac-arm:
    stage: test
    extends: .deploy-conda-mac-arm
    variables:
        UPLOAD: "no"
    before_script:
        - *before-script
    rules:
    - if: $CI_COMMIT_BRANCH != null

test-conda-x86:
    stage: test
    extends: .deploy-conda
    variables:
        UPLOAD: "no"
    before_script:
        - *prep-image
        - *before-script
    rules:
    - if: $CI_COMMIT_BRANCH != null
