include:
    - project: "epi2melabs/ci-templates"
      file:
          - "push-github.yaml"
          - "push-conda.yaml"
          - "snippets.yaml"
          - ".eks-tags.yaml"

image: ${UBUNTUIMAGE}:22.04

default:
  tags: !reference [.eks-small-standard-tags, tags]

.parallel-makeflags: &parallel-makeflags 'export MAKEFLAGS="-j$(nproc) --output-sync=target --no-print-directory"'

variables:
    GIT_SUBMODULE_STRATEGY: recursive
    GIT_SUBMODULE_FORCE_HTTPS: "true"
    IMAGE_CLANG: ${UBUNTUIMAGE}:26.04


.prep-image: &prep-image |
    DEBIAN_FRONTEND=noninteractive
    apt update -qq
    apt install -y --no-install-recommends git gcc autoconf automake valgrind make curl wget zlib1g-dev libbz2-dev libreadline-dev libssl-dev libffi-dev liblzma-dev libcurl4-gnutls-dev cmake python3 python3-venv clang-format clang-tidy clang-tools

.git-auth: &git-auth
    - git config --global --add url."https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/".insteadOf "https://${CI_SERVER_HOST}/"
    - git config --global --add url."https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/".insteadOf "ssh://git@${CI_SERVER_HOST}/"

.purrflate-submodule: &purrflate-submodule
    - *git-auth
    - git submodule update --init --checkout third_party/purrflate

stages:
    - preflight
    - test
    - package
    - package-artifacts
    - prerelease
    - release

.package-rules: &package-rules
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "dev"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG == null'
      when: manual
      allow_failure: true

.desktop-bundle-rules: &desktop-bundle-rules
    - if: '$CI_COMMIT_TAG =~ /^v[[:digit:]]+\.[[:digit:]]+\.[[:digit:]]+$/ && $CI_COMMIT_REF_PROTECTED == "true"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "dev"'
    - if: '$CI_PIPELINE_SOURCE == "push"'
      when: manual
      allow_failure: true

check-changelog:
    stage: preflight
    image: ${WHALEFISH}/${CWG_GLEEOK_IMAGE}
    script:
        - !reference [.install, gleeok]
        - gleeok changelog validate CHANGELOG.md

check-summary-json-schema:
    stage: test
    before_script:
        - *prep-image
    script:
        - make summary_json_schema_check
        - make summary_json_docs_check

check-report-template:
    stage: test
    before_script:
        - *prep-image
        - *git-auth
    script:
        - make report_template_check

.fastcat-test-base:
    stage: test
    before_script:
        - *prep-image
        - *git-auth
    script:
        - ./build/fastcat fastq --help
        - ./build/fastcat bam --help
        - ./build/fastcat qc --help
        - ./build/fastcat index --help

build_and_test:
    extends: .fastcat-test-base
    tags: !reference [.eks-large-standard-tags, tags]
    before_script:
        - *prep-image
        - *purrflate-submodule
    script:
        - *parallel-makeflags
        - make
        - !reference [.fastcat-test-base, script]
        - BUILD_MODE=valgrind make test

build_and_test_without_purrflate:
    extends: .fastcat-test-base
    tags: !reference [.eks-large-standard-tags, tags]
    variables:
        GIT_SUBMODULE_PATHS: "third_party/argp-standalone third_party/htslib third_party/zlib-ng"
    script:
        - *parallel-makeflags
        - test ! -e third_party/purrflate/src/zngp_reader.c
        - make NOPURRFLATE=1
        - !reference [.fastcat-test-base, script]
        - NOPURRFLATE=1 make test

build_and_test_macos_aarch64:
    stage: test
    tags:
        - macos
        - oxford
        - arm
        - shell
    before_script:
        - export HOMEBREW_NO_AUTO_UPDATE=1; brew list --versions argp-standalone openssl@3 > /dev/null || brew install argp-standalone openssl@3
        - git submodule update --init --checkout third_party/purrflate
    script:
        - export MAKEFLAGS="-j$(sysctl -n hw.ncpu) --output-sync=target --no-print-directory"
        - make
        - !reference [.fastcat-test-base, script]
        - make test_unit

build_and_test_windows_x86_64:
    stage: test
    tags:
        - epi2melabs-win
    before_script:
        - $ErrorActionPreference = 'Stop'
        - git submodule update --init --checkout third_party/purrflate
        - $env:MSYS2_ROOT = 'C:\msys64'
        - if (-not (Test-Path "$env:MSYS2_ROOT\usr\bin\bash.exe")) { throw 'Missing provisioned MSYS2 installation at C:\msys64.' }
        - $env:CHERE_INVOKING = 'yes'
        - $env:MSYSTEM = 'UCRT64'
    script:
        - '& "$env:MSYS2_ROOT\usr\bin\bash.exe" tools/ci/windows_toolchain_probe.sh'
        - '& "$env:MSYS2_ROOT\usr\bin\bash.exe" tools/ci/windows_build.sh check'

report_demo:
    extends: .fastcat-test-base
    tags: !reference [.eks-large-standard-tags, tags]
    script:
        - make -j"$(nproc)" --output-sync=target --no-print-directory
        - REPORT_DEMO_N=100000 REPORT_DEMO_UBAM_N=200 REPORT_DEMO_DURATION_S=172800 make test_report
        - rm -f test/tmp/report_html/reads.*fastq* test/tmp/report_html/aligned_reads.bam
        - mv test/tmp/report_html/ demo
    artifacts:
      when: always
      paths:
        - demo/

report_browser_smoke:
    stage: test
    image: mcr.microsoft.com/playwright/python:v1.52.0-noble
    needs:
        - job: report_demo
          artifacts: true
    script:
        - export CHROME_BIN="$(find /ms-playwright -type f -name chrome -print -quit)"
        - test -n "$CHROME_BIN"
        - python3 tools/dev-tools check_report_browser --browser "$CHROME_BIN" demo/fastcat_out/fastcat_report.html
        - python3 tools/dev-tools check_report_browser --browser "$CHROME_BIN" demo/aligned_out/fastcat_report.html

pages:
    stage: release
    needs:
        - job: report_demo
          artifacts: true
    script:
        - rm -rf public
        - mkdir -p public
        - cp -a demo/aligned_out/fastcat_report.html public/index.html
    artifacts:
        paths:
            - public
    rules:
        - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

clang_format_check:
    image: ${IMAGE_CLANG}
    stage: test
    before_script:
        - *prep-image
    script:
        - make clang_format_check

clang_tidy:
    image: ${IMAGE_CLANG}
    stage: test
    before_script:
        - *prep-image
    script:
        - BUILD_MODE=debug make clang_tidy

scan_build:
    image: ${IMAGE_CLANG}
    stage: test
    tags: !reference [.eks-large-standard-tags, tags]
    before_script:
        - *prep-image
    script:
        - *parallel-makeflags
        - BUILD_MODE=debug make scan_build
    artifacts:
        when: always
        expire_in: 7 days
        paths:
            - scan-build-results/

sanitize:
    extends: .fastcat-test-base
    tags: !reference [.eks-large-standard-tags, tags]
    script:
        - *parallel-makeflags
        - BUILD_MODE=sanitize make
        - !reference [.fastcat-test-base, script]
        - BUILD_MODE=sanitize make test

deploy-checks:
    stage: prerelease
    script:
        - !reference [.check, argp-c-version]
        - !reference [.check, changelog]
        - export LICENSE_FILE="BSD-4-CLAUSE"
        - !reference [.check, license]
    rules:
        - if: '$CI_COMMIT_TAG =~ /^v[[:digit:]]+\.[[:digit:]]+\.[[:digit:]]+$/'


.before-script: &before-script |
    export CONDA_PKG=${CI_PROJECT_NAME}
    export CONDA_PKG_VERSION=${CI_COMMIT_TAG/v/}
    cd conda

conda:
    extends: .deploy-conda
    before_script:
        - *prep-image
        - *purrflate-submodule
        - *before-script

conda-arm:
    extends: .deploy-conda-linux-arm
    before_script:
        - *prep-image
        - *purrflate-submodule
        - *before-script

conda-mac-arm:
    extends: .deploy-conda-mac-arm
    before_script:
        - *purrflate-submodule
        - *before-script

test-conda-arm:
    stage: package
    extends: .deploy-conda-linux-arm
    variables:
        UPLOAD: "no"
    before_script:
        - *prep-image
        - *purrflate-submodule
        - *before-script
    rules: *package-rules

test-conda-mac-arm:
    stage: package
    extends: .deploy-conda-mac-arm
    variables:
        UPLOAD: "no"
    before_script:
        - *purrflate-submodule
        - *before-script
    rules: *package-rules

test-conda-x86:
    stage: package
    extends: .deploy-conda
    variables:
        UPLOAD: "no"
    before_script:
        - *prep-image
        - *purrflate-submodule
        - *before-script
    rules: *package-rules


desktop-bundle-linux-x86_64:
    stage: package
    tags: !reference [.eks-large-standard-tags, tags]
    rules: *desktop-bundle-rules
    before_script:
        - *prep-image
    script:
        - *parallel-makeflags
        - BUILD_MODE=desktop DESKTOP_TARGET=linux-x86_64 make desktop_bundle
    artifacts:
      when: always
      paths:
        - build/desktop/


desktop-bundle-linux-aarch64:
    stage: package
    extends: .deploy-conda-linux-arm
    rules: *desktop-bundle-rules
    before_script:
        - *prep-image
    script:
        - *parallel-makeflags
        - BUILD_MODE=desktop DESKTOP_TARGET=linux-aarch64 make desktop_bundle
    artifacts:
      when: always
      paths:
        - build/desktop/


desktop-bundle-macos-aarch64:
    stage: package
    extends: .deploy-conda-mac-arm
    rules: *desktop-bundle-rules
    before_script:
        - export HOMEBREW_NO_AUTO_UPDATE=1; brew list --versions argp-standalone > /dev/null || brew install argp-standalone
        - *purrflate-submodule
    script:
        - export MAKEFLAGS="-j$(sysctl -n hw.ncpu)"; CC=clang BUILD_MODE=desktop DESKTOP_TARGET=macos-aarch64 make desktop_bundle
        - bundle=$(tar -tzf build/desktop/*-macos-aarch64.tar.gz | head -1 | cut -d/ -f1)
        - mkdir -p build/desktop-stage
        - tar -xzf build/desktop/*-macos-aarch64.tar.gz -C build/desktop-stage
        - tools/desktop/sign_macos.sh build/desktop-stage/$bundle
        - (cd build/desktop-stage/$bundle && shasum -a 256 fastcat nextflow_schema.json README.md LICENSE > SHA256SUMS)
        - tar -C build/desktop-stage -czf build/desktop/$bundle.tar.gz $bundle
        - ditto -c -k --keepParent build/desktop-stage/$bundle build/desktop/$bundle.zip
        - xcrun notarytool submit build/desktop/$bundle.zip --wait --apple-id "$OSX_NOTARIZE_USERNAME" --password "$OSX_NOTARIZE_PASSWORD" --team-id "$OSX_NOTARIZE_TEAMID"
        - rm build/desktop/$bundle.zip
    artifacts:
      when: always
      paths:
        - build/desktop/


desktop-bundle-macos-x86_64:
    stage: package
    tags:
        - x86
        - macos
        - oxford
    rules: *desktop-bundle-rules
    before_script:
        - export HOMEBREW_NO_AUTO_UPDATE=1; brew list --versions argp-standalone > /dev/null || brew install argp-standalone
        - *purrflate-submodule
    script:
        - export MAKEFLAGS="-j$(sysctl -n hw.ncpu)"; CC=clang BUILD_MODE=desktop DESKTOP_TARGET=macos-x86_64 make desktop_bundle
        - bundle=$(tar -tzf build/desktop/*-macos-x86_64.tar.gz | head -1 | cut -d/ -f1)
        - mkdir -p build/desktop-stage
        - tar -xzf build/desktop/*-macos-x86_64.tar.gz -C build/desktop-stage
        - tools/desktop/sign_macos.sh build/desktop-stage/$bundle
        - (cd build/desktop-stage/$bundle && shasum -a 256 fastcat nextflow_schema.json README.md LICENSE > SHA256SUMS)
        - tar -C build/desktop-stage -czf build/desktop/$bundle.tar.gz $bundle
        - ditto -c -k --keepParent build/desktop-stage/$bundle build/desktop/$bundle.zip
        - xcrun notarytool submit build/desktop/$bundle.zip --wait --apple-id "$OSX_NOTARIZE_USERNAME" --password "$OSX_NOTARIZE_PASSWORD" --team-id "$OSX_NOTARIZE_TEAMID"
        - rm build/desktop/$bundle.zip
    artifacts:
      when: always
      paths:
        - build/desktop/


desktop-bundle-windows-x86_64:
    stage: package
    tags:
        - epi2melabs-win
    rules: *desktop-bundle-rules
    before_script:
        - $ErrorActionPreference = 'Stop'
        - $env:MSYS2_ROOT = 'C:\msys64'
        - if (-not (Test-Path "$env:MSYS2_ROOT\usr\bin\bash.exe")) { throw 'Missing provisioned MSYS2 installation at C:\msys64.' }
        - $env:CHERE_INVOKING = 'yes'
        - $env:MSYSTEM = 'UCRT64'
        - 'Write-Host "PowerShell workspace: $(Get-Location)"'
        - 'Write-Host "MSYS2 bash: $env:MSYS2_ROOT\usr\bin\bash.exe"'
    script:
        - '& "$env:MSYS2_ROOT\usr\bin\bash.exe" tools/ci/windows_toolchain_probe.sh'
        - '& "$env:MSYS2_ROOT\usr\bin\bash.exe" tools/ci/windows_build.sh check'
        - '& "$env:MSYS2_ROOT\usr\bin\bash.exe" tools/desktop/windows_bundle.sh'
        - $archives = @(Get-ChildItem -Path build/desktop -Filter '*-windows-x86_64.tar.gz' -File)
        - if ($archives.Count -ne 1) { throw "Expected exactly one Windows Desktop archive, found $($archives.Count)." }
        - $archive = $archives[0]
        - $bundle = (tar -tzf $archive.FullName | Select-Object -First 1).Split('/')[0]
        - if ([string]::IsNullOrWhiteSpace($bundle)) { throw 'Desktop archive has no top-level bundle directory.' }
        - New-Item -ItemType Directory -Force build/desktop-stage | Out-Null
        - tar -xzf $archive.FullName -C build/desktop-stage
        - if (-not (Test-Path "build/desktop-stage/$bundle/fastcat.exe")) { throw 'Desktop archive does not contain fastcat.exe.' }
        - if (-not $env:CODESIGNTHUMBPRINT) { throw 'CODESIGNTHUMBPRINT must identify the Windows signing certificate.' }
        - if (-not $env:SIGNTOOL_PATH) { throw 'SIGNTOOL_PATH must point to signtool.exe.' }
        - if (-not (Test-Path $env:SIGNTOOL_PATH)) { throw "signtool.exe not found at $env:SIGNTOOL_PATH." }
        - if (-not (Get-ChildItem Cert:\LocalMachine\My | Where-Object { $_.Thumbprint -eq $env:CODESIGNTHUMBPRINT })) { throw 'Windows signing certificate was not found in LocalMachine\My.' }
        - 'Write-Host "Signing with signtool: $env:SIGNTOOL_PATH"'
        - powershell -ExecutionPolicy Bypass -File tools/desktop/sign_windows.ps1 -BundleDirectory "build/desktop-stage/$bundle"
        - Get-FileHash -Algorithm SHA256 build/desktop-stage/$bundle/fastcat.exe,build/desktop-stage/$bundle/nextflow_schema.json,build/desktop-stage/$bundle/README.md,build/desktop-stage/$bundle/LICENSE | ForEach-Object { "{0}  {1}" -f $_.Hash.ToLower(), $_.Path.Split([IO.Path]::DirectorySeparatorChar)[-1] } | Set-Content build/desktop-stage/$bundle/SHA256SUMS
        - tar -C build/desktop-stage -czf $archive.FullName $bundle
        - tar -tzf $archive.FullName
    artifacts:
      when: always
      paths:
        - build/desktop/


desktop-bundles:
    stage: package-artifacts
    rules: *desktop-bundle-rules
    needs:
        - job: desktop-bundle-linux-x86_64
          artifacts: true
        - job: desktop-bundle-linux-aarch64
          artifacts: true
        - job: desktop-bundle-macos-aarch64
          artifacts: true
        - job: desktop-bundle-macos-x86_64
          artifacts: true
        - job: desktop-bundle-windows-x86_64
          artifacts: true
    script:
        - mkdir -p build/desktop-bundles
        - find build/desktop -maxdepth 1 -type f -name '*.tar.gz' -exec cp {} build/desktop-bundles/ \;
        - test "$(find build/desktop-bundles -maxdepth 1 -type f -name '*.tar.gz' | wc -l)" -eq 5
        - (cd build/desktop-bundles && sha256sum *.tar.gz > SHA256SUMS)
        - tar -C build/desktop-bundles -czf build/fastcat-desktop-bundles.tar.gz .
    artifacts:
      paths:
        - build/fastcat-desktop-bundles.tar.gz
