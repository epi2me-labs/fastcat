include:
    - project: "epi2melabs/ci-templates"
      file: "push-github.yaml"
    - project: "epi2melabs/ci-templates"
      file: "push-conda.yaml"
    - project: "epi2melabs/ci-templates"
      file: "snippets.yaml"

image: ${UBUNTUIMAGE}:22.04

variables:
    GIT_SUBMODULE_STRATEGY: recursive


.prep-image: &prep-image |
    DEBIAN_FRONTEND=noninteractive
    apt update -qq
    apt install -y --no-install-recommends gcc autoconf automake valgrind make curl wget zlib1g-dev libbz2-dev libreadline-dev libssl-dev libffi-dev liblzma-dev libcurl4-gnutls-dev cmake python3 clang-format clang-tidy clang-tools

stages:
    - test
    - prerelease
    - release

.fastcat-test-base:
    stage: test
    before_script:
        - *prep-image
    artifacts:
      when: always
      paths:
        - test/*
    script:
        - ./fastcat fastq --help
        - ./fastcat bam --help
        - ./fastcat index --help

build:
    extends: .fastcat-test-base
    script:
        - make
        - !reference [.fastcat-test-base, script]
        - PEPPER=1 make test

clang_format:
    image: ${UBUNTUIMAGE}:24.04
    stage: test
    before_script:
        - *prep-image
    script:
        - make format_check

clang_tidy:
    image: ${UBUNTUIMAGE}:24.04
    stage: test
    before_script:
        - *prep-image
    script:
        - make clang_tidy

scan_build:
    image: ${UBUNTUIMAGE}:24.04
    stage: test
    before_script:
        - *prep-image
    script:
        - make scan_build
    artifacts:
        when: always
        expire_in: 7 days
        paths:
            - scan-build-results/

sanitize:
    extends: .fastcat-test-base
    script:
        - SANITIZE=ubsan make
        - !reference [.fastcat-test-base, script]
        - SANITIZE=ubsan make test

deploy-checks:
    stage: prerelease
    script:
        - !reference [.check, argp-c-version]
        - !reference [.check, changelog]
        - export LICENSE_FILE="BSD-4-CLAUSE"
        - !reference [.check, license]
    rules:
        - if: '$CI_COMMIT_TAG =~ /^v[[:digit:]]+\.[[:digit:]]+\.[[:digit:]]+$/'


.before-script: &before-script |
    export CONDA_PKG=${CI_PROJECT_NAME}
    export CONDA_PKG_VERSION=${CI_COMMIT_TAG/v/}
    cd conda

conda:
    extends: .deploy-conda
    before_script:
        - *prep-image
        - *before-script

conda-arm:
    extends: .deploy-conda-linux-arm
    before_script:
        - *prep-image
        - *before-script

conda-mac-arm:
    extends: .deploy-conda-mac-arm
    before_script:
        - *before-script

test-conda-arm:
    stage: test
    extends: .deploy-conda-linux-arm
    variables:
        UPLOAD: "no"
    before_script:
        - *prep-image
        - *before-script
    rules:
    - if: $CI_COMMIT_BRANCH != null

test-conda-mac-arm:
    stage: test
    extends: .deploy-conda-mac-arm
    variables:
        UPLOAD: "no"
    before_script:
        - *before-script
    rules:
    - if: $CI_COMMIT_BRANCH != null

test-conda-x86:
    stage: test
    extends: .deploy-conda
    variables:
        UPLOAD: "no"
    before_script:
        - *prep-image
        - *before-script
    rules:
    - if: $CI_COMMIT_BRANCH != null
